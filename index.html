<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chao · 四级大纲词汇</title>
<meta name="description" content="按艾宾浩斯记忆法复习的四级大纲背单词工具：闪卡、四选一测验、错词本与学习统计，数据保存在本机。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%231C3A34'/%3E%3Cpath d='M32 15 18 49M32 15 46 49M23 40h18' stroke='%23F3F1E9' stroke-width='4.4' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Newsreader:wght@400;600&amp;display=swap">
<style>
:root{
  --pine:#1C3A34;
  --pine-deep:#142B26;
  --pine-mid:#254A42;
  --paper:#F3F1E9;
  --card:#FDFCF6;
  --ink:#1A2722;
  --ink-2:#3D4B44;
  --muted:#6F7D76;
  --line:#DED9C9;
  --line-2:#EAE6D8;
  --seal:#AF3B2C;
  --seal-deep:#96301F;
  --seal-soft:#F5E1DB;
  --jade:#2C7161;
  --jade-soft:#E2EFE9;
  --amber:#9A6C1D;
  --amber-soft:#F3E8CE;
  --paper-dim:#FBF9F1;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
  --serif:"Newsreader",Georgia,"Songti SC","Times New Roman",serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
h1,h2,h3,p,ul,ol{margin:0}
button{font-family:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.serif{font-family:var(--serif)}

/* ===== 外壳：移动端 ===== */
.mobile-head{position:sticky;top:0;z-index:25;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.brand-mini{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:650;letter-spacing:.02em;text-decoration:none}
.brand-mini svg{display:block}
.streak-pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--pine);
  border:1px solid var(--line);padding:6px 10px;border-radius:2px;min-height:36px;background:var(--paper-dim)}

.sidebar{display:none}
main{padding:16px 16px 96px;max-width:1040px;margin:0 auto}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);
  background:var(--pine);border-top:1px solid rgba(255,255,255,.08);padding-bottom:env(safe-area-inset-bottom)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;
  padding:8px 2px;color:#A6B5AE;text-decoration:none;font-size:11px;letter-spacing:.02em}
.tab svg{opacity:.85}
.tab.active{color:#F6ECCB}
.tab.active svg{opacity:1}

@media (min-width:920px){
  .mobile-head,.tabbar{display:none}
  .app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
  .sidebar{display:flex;flex-direction:column;background:var(--pine);color:#EDE9DC;
    padding:26px 18px 22px;position:sticky;top:0;height:100vh}
  main{padding:44px 48px 72px;max-width:1040px}
}

/* ===== 侧栏内容 ===== */
.brand{display:flex;align-items:center;gap:10px;margin-bottom:34px;text-decoration:none;color:#F5F2E6}
.brand .mark{width:34px;height:34px;border:1px solid rgba(245,242,230,.25);display:flex;align-items:center;justify-content:center}
.brand .names{display:flex;flex-direction:column;line-height:1.25}
.brand .cn{font-size:16px;font-weight:650;letter-spacing:.08em}
.brand .en{font-family:var(--serif);font-size:11.5px;letter-spacing:.14em;color:#9FB2A9}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;min-height:44px;border-radius:2px;
  color:#B4C2BA;text-decoration:none;font-size:14.5px;position:relative;transition:background .16s,color .16s}
.nav-item:hover{background:rgba(255,255,255,.055);color:#F3EFE0}
.nav-item.active{background:rgba(255,255,255,.08);color:#F7EFD9}
.nav-item.active::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:2px;background:#DCC894}
.nav-item .count{margin-left:auto;font-family:var(--serif);font-size:12.5px;color:#8FA79D}
.side-foot{margin-top:auto;padding-top:20px;border-top:1px solid rgba(255,255,255,.1);font-size:12.5px;color:#93A69C;line-height:1.8}
.side-foot strong{display:block;font-family:var(--serif);font-size:22px;color:#F3EFE0;font-weight:500;line-height:1.3}

/* ===== 通用版式 ===== */
.kicker{font-size:12.5px;color:var(--muted);letter-spacing:.03em}
.display{font-size:clamp(26px,6.4vw,38px);font-weight:650;line-height:1.24;letter-spacing:-.01em;margin:6px 0 8px}
.display .num{font-family:var(--serif);font-size:1.16em;font-weight:600;color:var(--seal);letter-spacing:0}
.lead-sub{color:var(--ink-2);font-size:14px;max-width:44ch}
.sect{margin:30px 0 14px;padding-top:15px;border-top:1px solid var(--line);display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sect h2{font-size:15px;font-weight:650;letter-spacing:.02em}
.sect .meta{font-size:12.5px;color:var(--muted);white-space:nowrap}

.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;
  padding:11px 18px;border:1px solid var(--line);border-radius:2px;background:var(--card);color:var(--ink);
  font-size:14.5px;line-height:1.2;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:#fff;border-color:var(--pine-mid)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--seal);border-color:var(--seal);color:#FDF4EE}
.btn-primary:hover{background:var(--seal-deep);border-color:var(--seal-deep)}
.btn-lg{min-height:54px;padding:14px 24px;font-size:15.5px}
.btn-block{width:100%}
.btn-ghost{background:transparent}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.chip{appearance:none;min-height:44px;padding:9px 14px;border:1px solid var(--line);background:transparent;
  color:var(--ink-2);border-radius:2px;font-size:13px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.chip:hover{border-color:var(--pine-mid)}
.chip.active{background:var(--pine);border-color:var(--pine);color:#F4F0E2}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}
.chips.scroll .chip{flex:0 0 auto}
.field{width:100%;font:inherit;font-size:16px;min-height:46px;padding:10px 13px;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:2px}
.field::placeholder{color:#9AA69F}
.field:focus{outline:2px solid var(--seal);outline-offset:-1px;border-color:transparent}
.panel{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:18px 16px}
.empty{border:1px dashed var(--line);padding:40px 22px;text-align:center;background:rgba(253,252,246,.6)}
.empty h2{font-size:17px;font-weight:650;margin-bottom:6px}
.empty p{color:var(--muted);font-size:13.5px;max-width:34ch;margin:0 auto 18px}
.tiny{font-size:12.5px;color:var(--muted);line-height:1.7}

/* ===== 今日 ===== */
.today-lead{display:grid;grid-template-columns:1fr;gap:16px;align-items:center;padding:6px 0 18px}
@media (min-width:760px){.today-lead{grid-template-columns:minmax(0,1fr) auto;gap:36px}}
.ring-wrap{position:relative;width:132px;height:132px;justify-self:start}
@media (min-width:760px){.ring-wrap{justify-self:end}}
.ring{width:132px;height:132px;display:block}
.ring-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.ring-mid .n{font-family:var(--serif);font-size:26px;font-weight:600}
.ring-mid .l{font-size:11.5px;color:var(--muted);letter-spacing:.06em}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:4px 0 22px}
.metric{background:var(--paper);padding:13px 4px 15px}
.metric .n{display:block;font-family:var(--serif);font-size:30px;line-height:1.1;font-weight:500}
.metric .l{font-size:12.5px;color:var(--muted)}
.metric .n.is-seal{color:var(--seal)}
.metric .n.is-jade{color:var(--jade)}
.cta-row{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
@media (min-width:560px){.cta-row{flex-direction:row}.cta-row .btn{flex:1}}
.preview-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
@media (min-width:700px){.preview-grid{grid-template-columns:repeat(5,1fr)}}
.pchip{display:flex;align-items:baseline;gap:8px;background:var(--card);padding:13px 12px;min-height:56px;
  text-decoration:none;transition:background .15s}
.pchip:hover{background:#fff}
.pchip .i{font-family:var(--serif);font-size:12px;color:var(--seal);min-width:12px}
.pchip .w{font-family:var(--serif);font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.pchip .p{font-family:var(--serif);font-size:11px;color:var(--muted);font-style:italic}

/* ===== 学习卡片 ===== */
.study-wrap{max-width:740px;margin:0 auto}
.card-top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);
  letter-spacing:.03em;margin-bottom:10px;gap:10px}
.card-top .grp{border:1px solid var(--line);padding:2px 8px;border-radius:2px;white-space:nowrap}
.wcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:3px;
  padding:30px 20px 26px;min-height:322px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;box-shadow:0 1px 0 #E7E3D3,0 30px 46px -42px rgba(24,44,38,.75);cursor:pointer}
.wcard::after{content:"";position:absolute;inset:7px;border:1px solid rgba(28,58,52,.07);pointer-events:none}
@media (min-width:600px){.wcard{padding:44px 40px 34px;min-height:360px}}
.headword{font-family:var(--serif);font-size:clamp(34px,9.6vw,54px);font-weight:500;line-height:1.08;
  letter-spacing:-.012em;word-break:break-word;margin-bottom:10px}
.ipa{font-family:var(--serif);font-size:13px;color:var(--muted);letter-spacing:.05em;font-style:italic}
.word-tools{display:flex;gap:8px;margin-top:14px}
.icon-btn{appearance:none;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:2px;background:transparent;color:var(--ink-2);cursor:pointer}
.icon-btn:hover{border-color:var(--pine-mid);color:var(--pine)}
.reveal{margin-top:22px;padding-top:20px;border-top:1px solid var(--line-2);width:100%;animation:fadeUp .26s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.meaning{font-size:19px;line-height:1.55}
.pos-tag{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--jade);margin-right:6px}
.ex{text-align:left;margin-top:18px}
.ex .en{font-family:var(--serif);font-size:15.5px;line-height:1.6;color:#2A3A33}
.ex .cn{font-size:13.5px;color:var(--muted);margin-top:4px}
.ex-label{font-size:11.5px;color:var(--muted);letter-spacing:.1em;margin-bottom:4px}
.tap-hint{margin-top:22px;font-size:12.5px;color:#93A19A;letter-spacing:.05em}
.grade{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
@media (min-width:680px){.grade{grid-template-columns:repeat(4,1fr)}}
.grade .btn{flex-direction:column;gap:1px;min-height:58px;background:var(--card)}
.grade .t{font-size:14.5px}
.grade .s{font-size:11px;color:var(--muted)}
.grade .g-again{color:var(--seal);border-color:#E0BDB4}
.grade .g-again:hover{background:var(--seal-soft);border-color:var(--seal)}
.grade .g-hard{color:var(--amber);border-color:#E1D1A9}
.grade .g-hard:hover{background:var(--amber-soft);border-color:var(--amber)}
.grade .g-good{color:var(--jade);border-color:#BFD8CE}
.grade .g-good:hover{background:var(--jade-soft);border-color:var(--jade)}
.grade .g-easy{color:var(--pine);border-color:#BFD1CA}
.grade .g-easy:hover{background:#E9F0EC;border-color:var(--pine)}
.kbd-tip{text-align:center;font-size:12px;color:var(--muted);margin-top:14px}
.summary{background:var(--card);border:1px solid var(--line);padding:26px 20px;text-align:center}
.summary h2{font-size:20px;font-weight:650;margin:6px 0 4px}
.sum-row{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:14px 0 20px}
.sum-row b{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--ink);margin-right:3px}
.summary .btn-row{justify-content:center}

/* ===== 测验 ===== */
.quiz-wrap{max-width:680px;margin:0 auto}
.q-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;font-size:12.5px;color:var(--muted)}
.q-prompt{background:var(--card);border:1px solid var(--line);padding:28px 20px;text-align:center;margin-bottom:14px}
.q-prompt .qw{font-family:var(--serif);font-size:clamp(28px,7vw,40px);line-height:1.15;display:block}
.q-prompt .qc{font-size:20px;line-height:1.5}
.q-prompt .qi{font-family:var(--serif);font-style:italic;font-size:12.5px;color:var(--muted);display:block;margin-top:6px}
.q-opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:13px 15px;text-align:left;
  border:1px solid var(--line);border-radius:2px;background:var(--card);font-size:15px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--pine-mid);background:#fff}
.opt .num{font-family:var(--serif);font-size:13px;color:var(--muted);min-width:14px}
.opt.correct{border-color:var(--jade);background:var(--jade-soft);color:#1F4D42}
.opt.correct .num{color:var(--jade)}
.opt.wrong{border-color:var(--seal);background:var(--seal-soft);color:#7B2A1D}
.opt.wrong .num{color:var(--seal)}
.opt:disabled{cursor:default}
.opt .mark{margin-left:auto;font-size:12.5px}
.q-feedback{margin-top:14px;border-left:2px solid var(--jade);padding:2px 0 2px 12px;font-size:13.5px;color:var(--ink-2)}
.q-feedback.bad{border-color:var(--seal)}
.q-feedback .en{font-family:var(--serif);font-size:14.5px;display:block;margin-bottom:2px}
.quiz-result{background:var(--card);border:1px solid var(--line);padding:26px 20px;text-align:center}
.score{font-family:var(--serif);font-size:44px;line-height:1.1;font-weight:500;margin:6px 0}
.score span{font-size:20px;color:var(--muted)}
.wrong-mini{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0 20px}
.wrong-mini .t{font-family:var(--serif);font-size:13.5px;border:1px solid #E4C4BB;background:var(--seal-soft);
  color:#7B2A1D;padding:3px 8px;border-radius:2px}

/* ===== 词库 ===== */
.bank-tools{display:grid;gap:10px;margin-bottom:14px}
.bank-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;
  padding:13px 2px;border-bottom:1px solid var(--line-2)}
.bank-row:first-child{border-top:1px solid var(--line-2)}
@media (min-width:780px){.bank-row{grid-template-columns:220px minmax(0,1fr) auto;padding:11px 2px}}
.bw{display:flex;align-items:baseline;gap:8px;min-width:0}
.bw .w{font-family:var(--serif);font-size:18px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.bw .i{font-family:var(--serif);font-style:italic;font-size:11.5px;color:var(--muted);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.bm{font-size:13.5px;color:var(--ink-2);min-width:0}
.bm .pt{font-family:var(--serif);font-style:italic;color:var(--jade);font-size:12.5px;margin-right:5px}
.bs{display:flex;align-items:center;gap:6px;grid-column:2;justify-self:end}
@media (min-width:780px){.bs{grid-column:auto}}
.badge{font-size:11.5px;padding:2px 7px;border:1px solid var(--line);color:var(--muted);border-radius:2px;white-space:nowrap;line-height:1.5}
.badge.master{color:var(--jade);border-color:#BCD7CD;background:var(--jade-soft)}
.badge.learn{color:var(--amber);border-color:#E2D1A8;background:var(--amber-soft)}
.badge.wrong{color:var(--seal);border-color:#E3BFB5;background:var(--seal-soft)}
.badge.freq{color:#254A42;border-color:#C3D6CF;background:#EDF3F0;font-variant-numeric:tabular-nums}
.badge.freq-off{color:var(--muted);border-style:dashed}
.freq-note{font-size:12px;color:var(--muted);margin-top:8px;letter-spacing:.02em}
.exam-band{display:inline-block;margin:2px 0 10px;padding:7px 12px;border:1px solid var(--line);
  border-radius:2px;background:var(--paper-dim);font-size:13.5px;color:var(--pine);line-height:1.5}
.exam-band b{font-weight:600}
.exam-band .num{font-family:var(--serif);font-size:1.28em;color:var(--seal);font-weight:600;letter-spacing:.01em}
.tx-card{border:1px solid var(--line);background:var(--paper-dim);border-radius:2px;padding:14px 16px;margin-bottom:14px}
.tx-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.tx-tag{font-size:12px;color:var(--pine);letter-spacing:.03em;border:1px solid var(--line);padding:2px 8px;border-radius:2px;background:#fff}
.tx-flag{font-size:12px;color:var(--seal);white-space:nowrap}
.tx-cn{font-size:15px;line-height:1.85;color:var(--ink);text-align:justify}
.tx-en{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.tx-en-hd{font-size:12px;color:var(--muted);letter-spacing:.08em;margin-bottom:6px}
.tx-en-b{font-family:var(--serif);font-size:14.5px;line-height:1.8;color:var(--pine-deep)}
.tx-tip{margin-top:10px;font-size:12.5px;line-height:1.75;color:var(--muted);background:var(--paper);padding:10px 12px;border-radius:2px}
.tx-tip b{color:var(--pine);margin-right:6px}
.tx-acts{display:flex;gap:10px;margin-top:12px}
.tx-acts .btn{flex:1;min-height:44px}
.sent-rest{display:none}
.sent-rest.open{display:block}
.more-btn{display:block;width:100%;margin:4px 0 2px;padding:10px 12px;min-height:44px;
  border:1px dashed var(--line);background:transparent;color:var(--pine);border-radius:2px;
  font-family:inherit;font-size:13px;cursor:pointer;text-align:center}
.more-btn:active{background:var(--seal-soft);border-color:var(--seal)}
.exam-set{display:grid;gap:10px;max-width:420px;margin-bottom:22px}
.goal-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
.goal-lab{font-size:13.5px;color:var(--pine);font-weight:600}
.goal-num{width:82px;text-align:center;font-size:16px;padding:9px 8px;margin:0}
.step{width:44px;height:44px;min-width:44px;border:1px solid var(--line);background:var(--paper-dim);
  color:var(--pine);border-radius:2px;font-size:18px;line-height:1;cursor:pointer;font-family:inherit}
.step:active{background:var(--seal-soft);border-color:var(--seal)}
@media (max-width:520px){.exam-band{display:block;font-size:13px}}
.ext{margin-top:20px;text-align:left;border-top:1px solid var(--line-2);padding-top:16px}
.ext-tag{display:inline-block;font-size:11px;letter-spacing:.08em;color:var(--jade);background:var(--jade-soft);border-radius:3px;padding:2px 6px;margin-right:8px;vertical-align:1px}
.ext-q{font-size:13px;line-height:1.7;color:#33443C;margin-bottom:12px}
.fam-line{display:flex;gap:8px;font-size:13px;line-height:1.6;margin-bottom:5px;align-items:baseline}
.fam-key{flex:0 0 46px;color:var(--muted);font-size:12px;letter-spacing:.04em}

function letterGroup(w) {
  var c = (w || '').charAt(0).toUpperCase();
  return (c >= 'A' && c <= 'Z') ? c : '其他';
}
function parseLines(txt, group) {
  var out = [];
  txt.split('\n').forEach(function (line) {
    var s = line.trim();
    if (!s) return;
    var p = s.split('|');
    var w = (p[0] || '').trim();
    if (!w) return;
    out.push({
      w: w,
      pos: (p[1] || '').trim(),
      cn: (p[2] || '').trim(),
      ipa: (p[3] || '').trim(),
      ex: (p[4] || '').trim(),
      excn: (p[5] || '').trim(),
      group: group || letterGroup(w),
      fr: freqOf(w, 0),
      fc: freqOf(w, 1),
      id: w.toLowerCase()
    });
  });
  return out;
}

function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function dayKey(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function parseKey(k) {
  var p = k.split('-');
  return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
}
function shiftKey(key, n) {
  var d = parseKey(key);
  d.setDate(d.getDate() + n);
  return dayKey(d);
}
function startOfToday() {
  var d = new Date();
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}
function dueStamp(days) {
  var d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + days);
  return d.getTime();
}
function fmtDate() {
  var d = new Date();
  var wk = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
  return d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 · 星期' + wk;
}

var EXAM_TRANS = [{"id": "202606-3", "lab": "2026年6月 · 第3套", "yr": "2026", "cn": "在中国传统文化中，亲朋好友之间互赠礼物是人际交往的一种重要礼节 (etiquette)。赠送礼物不仅是物质的馈赠，更是情感的表达，是维系人际关系的重要纽带。一份精心挑选、符合接受者喜好的礼物，往往能加深彼此的感情。中国人遵循 \"礼尚往来\" (mutually exchanging courtesies) 的传统，接受礼物时会表达谢意，并适时回赠礼物，以增进彼此的融洽关系。", "en": "In traditional Chinese culture, exchanging gifts among relatives and friends is an important etiquette in interpersonal communication. Giving gifts is not only a material offering, but also an expression of emotion and a vital bond that maintains interpersonal relationships. A thoughtfully chosen gift that suits the recipient's taste can often deepen mutual affection. The Chinese follow the tradition of \"mutually exchanging courtesies\" — they express gratitude when receiving a gift and give a gift in return at an appropriate time, so as to enhance harmonious relations with each other.", "tip": "解析： “互赠礼物”：译为 “exchanging gifts”，简洁准确。 “不仅是…更是…”：用 “not only…but also…” 结构。 “维系人际关系的重要纽带”：译为 “a vital bond that maintains interpersonal relationships”。 “精心挑选、符合接受者喜好”：译为 “a thoughtfully chosen gift that suits the recipient's taste”。 “礼尚往来”：采用文中给出的英文 “mutually exchanging courtesies”，并加引 号。 “增进融洽关系”：译为 “enhance harmonious relations”。"}, {"id": "202606-2", "lab": "2026年6月 · 第2套", "yr": "2026", "cn": "餐桌礼仪 (dining etiquette) 是中华传统文化的重要组成部分，蕴含着热情有礼的待客之道。为了招待客人，主人会根据客人的口味和喜好准备丰富精致的菜肴。就餐座位的安排非常讲究，主人坐在正对大门的位置，在主人身边就座的是最重要的客人。进餐时，主人会不时地为客人添酒加菜。这种独特的餐桌礼仪已延续了数千年，对促进和谐的人际交往起到了重要作用。", "en": "Dining etiquette is an important part of traditional Chinese culture, embodying a warm and courteous way of hospitality. To entertain guests, the host will prepare a variety of exquisite dishes according to the guests' tastes and preferences. The seating arrangement at the dining table is very particular — the host sits in the seat directly facing the main entrance, and the most important guest sits next to the host. During the meal, the host will frequently offer the guests more wine and food. This unique dining etiquette has been passed down for thousands of years and has played a significant role in promoting harmonious interpersonal communication.", "tip": "解析： “热情有礼的待客之道”：译为 “a warm and courteous way of hospitality”，准 确传达“热情”与“有礼”。 “口味和喜好”：译为 “tastes and preferences”，简洁且贴近原文。 “非常讲究”：译为 “is very particular”，表达“有讲究、有讲究的”之意。 “正对大门的位置”：译为 “the seat directly facing the main entrance”，空间方 位清晰。 “添酒加菜”：译为 “offer the guests more wine and food”，动词 offer 体现主 人主动之意。 “延续了数千年”：译为 “has been passed down for thousands of years”，pass down 表示“传承”。"}, {"id": "202606-1", "lab": "2026年6月 · 第1套", "yr": "2026", "cn": "中国有句老话：\"一日为师，终身为父\"。在中国人的观念里，老师不仅传授知识，更教给学生做人的道理。在古代，学生初次见老师时要举行隆重的仪式，足见老师地位之高。为弘扬尊师的优良传统，中国从1985年开始将每年的9月10日定为教师节。在这一天，学生以各种方式表达对老师的敬意。尊师是中华民族的传统美德，在当今社会得到了发扬光大。", "en": "There is an old Chinese saying: \"A teacher for one day is a father for a lifetime.\" In the Chinese mindset, teachers not only impart knowledge but also teach students the principles of life. In ancient times, students held a solemn ceremony when they first met their teacher, which shows how highly teachers were respected. To promote the fine tradition of respecting teachers, China has designated September 10th as Teachers' Day since 1985. On this day, students express their respect for teachers in various ways. Respecting teachers is a traditional virtue of the Chinese nation and has been carried forward in today's society.", "tip": "解析： “一日为师，终身为父”：采用意译，保留谚语风格，译为“A teacher for one day is a father for a lifetime.” “在中国人的观念里”：译为“In the Chinese mindset”，简洁地道。 “做人的道理”：译为“principles of life”，符合语境。 “举行隆重的仪式”：译为“held a solemn ceremony”。 “地位之高”：译为“how highly teachers were respected”，使用被动结构突出 尊崇。 “尊师是中华民族的传统美德”：译为“Respecting teachers is a traditional virtue of the Chinese nation”，主谓清晰。 “发扬光大”：译为“carried forward”，表示传承和弘扬。"}, {"id": "202512-3", "lab": "2025年12月 · 第3套", "yr": "2025", "cn": "中国政府十分重视绿色经济的发展。通过加强森林资源保护、加大污染治理力度等一系列措施，许多地区的生态环境得到了显著改善。绿水青山(lucid waters and lush mountains)促进了当地的旅游、健康等产业的发展，创造了可观的经济效益。如今，生态环境与人类社会和谐共存的观念在中国已深入人心。绿色经济的推进不仅能为中国可持续发展做出贡献，也为全球环境保护提供了宝贵经验。", "en": "The Chinese government attaches great importance to the development of the green economy. Through a series of measures such as strengthening forest resource protection and intensifying pollution control, the ecological environment in many regions has been significantly improved. Lucid waters and lush mountains have boosted the development of local industries such as tourism and health, creating considerable economic benefits. Today, the concept of harmonious coexistence between the ecological environment and human society has taken deep root in the hearts of the Chinese people. The advancement of the green economy not only contributes to China's sustainable development but also provides valuable experience for global environmental protection.", "tip": "高度重视 “attaches great importance to”；绿色经济 “green economy”；加强……保护 “strengthening the protection of”；加大……治理力度 “intensifying the control of”；显著改善 “significantly improved”；绿水青山 “lucid waters and lush mountains”；可观的经济效益 “considerable economic benefits”；深入人心 “has taken deep root in the hearts of”；可持续发展 “sustainable development”；宝贵经验 “valuable experience”。"}, {"id": "202512-2", "lab": "2025年12月 · 第2套", "yr": "2025", "cn": "近年来，“城市漫步(city walk)”在中国的年轻人中悄然兴起，已成为一种旅游新潮流。与传统旅游不同，城市漫步不追求在短时间内游览尽可能多的景点，而是随意行走或按照主题路线漫步在城市的大街小巷。漫步者品尝地道小吃，欣赏特色建筑，了解当地生活方式。他们运用相机或手机记录城市的风景和人物。这种旅游方式能让城市漫步者更深入了解城市的历史与文化。", "en": "In recent years, \"city walk\" has quietly emerged among young people in China and become a new trend in tourism. Unlike traditional tourism, city walk does not pursue visiting as many attractions as possible in a short time, but rather involves walking randomly or following thematic routes through the streets and lanes of the city. Walkers taste local snacks, admire distinctive architecture, and learn about the local way of life. They use cameras or smartphones to capture the city's scenery and people. This form of tourism allows city walkers to gain a deeper understanding of the city's history and culture.", "tip": "悄然兴起 “has quietly emerged”；旅游新潮流 “a new trend in tourism”；不追求 “does not pursue”；景点 “attractions”；随意行走 “walking randomly”；主题路线 “thematic routes”；地道小吃 “local snacks”；特色建筑 “distinctive architecture”；生活方式 “way of life”；记录 “capture”；更深入了解 “gain a deeper understanding”。"}, {"id": "202512-1", "lab": "2025年12月 · 第1套", "yr": "2025", "cn": "近年来，中国政府高度重视民营经济（private economy）的发展，出台了一系列政策支持民营企业。截至 2025 年 3 月底，全国民营企业数量超过 5700 万家，占企业总量的 92.3%。民营企业不仅数量稳步增长，质量和结构也在不断提升。民营企业的研发投入不断增加，在新一代信息技术、人工智能等领域发展迅速。民营企业核心竞争力的增强为中国经济的高质量发展提供了有力支撑。", "en": "In recent years, the Chinese government has attached great importance to the development of the private economy and has introduced a series of policies to support private enterprises. By the end of March 2025, the number of private enterprises nationwide had exceeded 57 million, accounting for 92.3% of all enterprises. Private enterprises have not only grown steadily in number, but also improved in quality and structure. Their investment in research and development has been increasing, and they have developed rapidly in fields such as newgeneration information technology and artificial intelligence. The strengthening of the core competitiveness of private enterprises has provided strong support for the high-quality development of China's economy.", "tip": "高度重视 “attached great importance to”；出台一系列政策 “introduced a series of policies”；截至 “by the end of”；占企业总量 “accounting for all enterprises”；稳步增长 “grown steadily”；研发投入 “investment in research and development”；新一代信息技术 “new-generation information technology”；核心竞争力 “core competitiveness”；高质量发展 “high-quality development”。"}, {"id": "202506-3", "lab": "2025年6月 · 第3套", "yr": "2025", "cn": "近年来，中国越来越多的城市着力打造“15分钟便民生活圈（convenient living circles）”。社区居民步行15分钟就能享受到日常所需的公共服务。生活圈内建有便利店、公园、健身场地、图书馆、学校、社区食堂、诊所等。生活圈的建立能够为居民提供更加便利、舒适、友好、愉悦的生活环境，更好地满足城市居民多元化的日常生活服务需求，提升居民的生活品质和幸福感。", "en": "In recent years, a growing number of cities in China have been striving to build \"15-minute convenient living circles\". Residents in the community can enjoy the public services they need for daily life within a 15-minute walk. The living circle is equipped with convenience stores, parks, fitness facilities, libraries, schools, community canteens, clinics, and so on. The establishment of such living circles can provide residents with a more convenient, comfortable, friendly and pleasant living environment, better meet the diverse needs of urban residents for daily services, and enhance their quality of life and sense of well-being.", "tip": "“着力打造” → striving to build “便民生活圈” → convenient living circles “日常所需的公共服务” → public services they need for daily life “配备” → is equipped with “多元化的日常生活服务需求” → diverse needs for daily services “生活品质和幸福感” → quality of life and sense of well-being"}, {"id": "202506-2", "lab": "2025年6月 · 第2套", "yr": "2025", "cn": "近年来，中国东北地区正在大力开发冰雪资源。例如，哈尔滨利用丰富的冰雪资源打造了极具地方特色的“冰雪大世界”，让游客在欣赏冰雪之美的同时也能够体验当地独特的民俗文化。如今，曾令人畏惧的冰天雪地正吸引着四面八方的游客，成为深受欢迎的旅游胜地。冰雪旅游业正为当地的经济发展做出越来越大的贡献。", "en": "In recent years, Northeast China has been vigorously developing its ice and snow resources. For example, Harbin has utilized its abundant ice and snow resources to create the \"Harbin Ice and Snow World\", which features strong local characteristics, allowing tourists to appreciate the beauty of ice and snow while also experiencing the unique local folk culture. Nowadays, the once formidable frozen landscape is attracting tourists from all directions and has become a popular tourist destination. The ice and snow tourism industry is making an increasingly significant contribution to the local economic development.", "tip": "“大力开发” → vigorously developing “极具地方特色” → features strong local characteristics “曾令人畏惧的” → once formidable “四面八方的游客” → tourists from all directions “做出越来越大的贡献” → making an increasingly significant contribution"}, {"id": "202506-1", "lab": "2025年6月 · 第1套", "yr": "2025", "cn": "被誉为“杂交水稻(hybrid rice)之父”的袁隆平和他的科研团队克服重重困难，研发出了一种超级杂交水稻。这项技术获得了举世公认的巨大成功。通过这项技术的应用，水稻抗旱抗病能力更强，能适应不同的气候和土壤条件，产量可提高20%-30%。超级杂交水稻营养丰富，口感更佳。目前，这项技术已经在许多国家得到广泛应用，为全球粮食安全做出了重大贡献。", "en": "Yuan Longping, honored as the \"father of hybrid rice\", together with his research team, overcame numerous difficulties to develop a super hybrid rice. This technology has achieved great success that is widely recognized around the world. Through the application of this technology, rice has become more resistant to drought and diseases, and can adapt to different climates and soil conditions, with yields increased by 20% to 30%. Super hybrid rice is rich in nutrition and has a better taste. At present, this technology has been widely applied in many countries, making a significant contribution to global food security.", "tip": "“被誉为” → honored as 或 known as 。 “克服重重困难” → overcame numerous difficulties 。 “举世公认” → widely recognized around the world 。 “抗旱抗病能力更强” → more resistant to drought and diseases 。 “为……做出重大贡献” → making a significant contribution to ... 。 📚 仅供参考"}, {"id": "202412-3", "lab": "2024年12月 · 第3套", "yr": "2024", "cn": "敦煌莫高窟(Mogao Grottoes)数字展示中心于2014年开放启用，是莫高窟保护利用工程的重要组成部分。展示中心采用数字技术和多媒体展示手段，使游客进入洞窟参观之前就能了解莫高窟的历史文化，鉴赏莫高窟的艺术经典。这将减少开放洞窟的数量，缩短游客在洞窟内的逗留时间，减轻参观对莫高窟造成的影响，以使这一世界文化遗产得到妥善保护、长久利用。", "en": "The Digital Exhibition Center of the Mogao Grottoes in Dunhuang was opened in 2014 and is an important part of the conservation and utilization project of the Mogao Grottoes. The center employs digital technology and multimedia display methods, enabling visitors to learn about the history and culture of the Mogao Grottoes and appreciate its artistic classics before entering the caves. This will reduce the number of caves open to the public, shorten the time visitors spend inside the caves, and mitigate the impact of tourism on the Mogao Grottoes, so that this world cultural heritage site can be properly protected and sustainably utilized for the long term.", "tip": "“数字展示中心” → Digital Exhibition Center “开放启用” → was opened “保护利用工程” → conservation and utilization project “采用数字技术和多媒体展示手段” → employs digital technology and multimedia display methods “鉴赏艺术经典” → appreciate its artistic classics “缩短逗留时间” → shorten the time visitors spend “减轻影响” → mitigate the impact “妥善保护、长久利用” → properly protected and sustainably utilized for the long term"}, {"id": "202412-2", "lab": "2024年12月 · 第2套", "yr": "2024", "cn": "近年来，中国新能源汽车产业发展迅速。目前，中国新能源汽车年产量已高达近千万辆，占全球市场份额超过60%，出口量不断创出新高。中国政府通过加大资金投入和政策引导，鼓励新能源汽车企业进行技术创新，不断提高产品在市场上的竞争力。中国新能源汽车产业的发展不仅有力推动了国内经济发展，也为全球新能源利用和环境保护做出了积极贡献。", "en": "In recent years, China's new energy vehicle industry has developed rapidly. At present, the annual production of new energy vehicles in China has reached nearly 10 million units, accounting for more than 60% of the global market share, and exports have continuously hit new highs. The Chinese government, through increased financial investment and policy guidance, encourages new energy vehicle enterprises to carry out technological innovation, continuously improving the competitiveness of their products in the market. The development of China's new energy vehicle industry has not only effectively promoted domestic economic growth but also made positive contributions to global new energy utilization and environmental protection.", "tip": "“新能源汽车” → new energy vehicles “年产量” → annual production “占全球市场份额” → accounting for the global market share “加大资金投入” → increased financial investment “政策引导” → policy guidance “竞争力” → competitiveness “做出积极贡献” → made positive contributions"}, {"id": "202412-1", "lab": "2024年12月 · 第1套", "yr": "2024", "cn": "中国政府十分重视环境保护。近年来，中国在减少空气、水和土壤污染上取得了显著成效。为了不断改善人们的生活环境，中国采取了一系列有效措施，包括大力发展清洁能源，改善公共交通，推广共享单车，实施垃圾分类。通过这些措施，中国的城市和农村正在绿起来、美起来。中国还积极参与国际合作，为全球环境保护做出了重要贡献。", "en": "The Chinese government attaches great importance to environmental protection. In recent years, China has made remarkable progress in reducing air, water and soil pollution. In order to continuously improve people's living environment, China has adopted a series of effective measures, including vigorously developing clean energy, improving public transportation, promoting bike-sharing, and implementing waste sorting. Through these measures, China's cities and rural areas are becoming greener and more beautiful. China also actively participates in international cooperation and has made significant contributions to global environmental protection.", "tip": "“十分重视” → attaches great importance to “显著成效” → remarkable progress “大力发展” → vigorously developing “实施垃圾分类” → implementing waste sorting “绿起来、美起来” → becoming greener and more beautiful “积极参与” → actively participates in"}, {"id": "202406-3", "lab": "2024年6月 · 第3套", "yr": "2024", "cn": "汉语中的“福”字(the character fu)表示幸福和好运，是中国传统文化中最常用的吉祥 (auspicious)符号之一。人们通常将一个大大的福字写在红纸上，寓意期盼家庭幸福、社会安定、国家昌盛。春节贴福字是民间由来已久的习俗。为了欢度春节，家家户户都会将福字贴在门上或墙上，表达对幸福生活的向往、对美好未来的期待。人们有时还将福字倒过来贴，表示幸福已到、好运已到。", "en": "The character \"fu\" in Chinese, meaning happiness and good fortune, is one of the most commonly used auspicious symbols in traditional Chinese culture. People usually write a large \"fu\" character on red paper, symbolizing their hopes for family happiness, social stability, and national prosperity. Pasting the \"fu\" character during the Spring Festival is a timehonored folk custom. To celebrate the Spring Festival, every household pastes the character on doors or walls to express their longing for a happy life and their expectations for a bright future. Sometimes, people paste the \"fu\" character upside down, indicating that happiness and good fortune have arrived.", "tip": "“福”字 → the character \"fu\" “吉祥符号” → auspicious symbols “寓意” → symbolizing “期盼” → hopes for “社会安定、国家昌盛” → social stability and national prosperity “由来已久的习俗” → a time-honored custom “表达向往和期待” → express their longing and expectations “倒过来贴” → paste upside down “表示幸福已到” → indicating that happiness has arrived"}, {"id": "202406-2", "lab": "2024年6月 · 第2套", "yr": "2024", "cn": "农历(the lunar calendar)起源于数千年前的中国，根据太阳和月亮的运行规律制定。长期以来，农历在农业生产和人们日常生活中发挥着重要作用。古人依据农历记录日期、安排农活，以便最有效地利用自然资源和气候条件，提高农作物的产量和质量。中国的春节、中秋节等传统节日的日期都基于农历。农历是中国传统文化的重要组成部分，当今依然广为使用。", "en": "The lunar calendar originated in China thousands of years ago and was formulated based on the movements of the sun and the moon. For a long time, the lunar calendar has played an important role in agricultural production and people's daily lives. Ancient people used the lunar calendar to record dates and arrange farming activities so as to make the most efficient use of natural resources and climatic conditions, thereby improving the yield and quality of crops. The dates of traditional Chinese festivals such as the Spring Festival and the Mid-Autumn Festival are all based on the lunar calendar. The lunar calendar is an important part of traditional Chinese culture and is still widely used today.", "tip": "“农历” → the lunar calendar “起源于” → originated in “根据...制定” → was formulated based on “发挥着重要作用” → played an important role “安排农活” → arrange farming activities “最有效地利用” → make the most efficient use of “提高产量和质量” → improve the yield and quality “基于” → are based on “重要组成部分” → an important part of “广为使用” → widely used"}, {"id": "202406-1", "lab": "2024年6月 · 第1套", "yr": "2024", "cn": "四合院(siheyuan)是中国一种传统的住宅建筑，其特点是房屋建造在一个院子的四周，将院子合围在中间。四合院通常冬暖夏凉，环境舒适，尤其适合大家庭居住。四合院在中国各地有多种类型，其中以北京的四合院最为典型。如今，随着现代城市的发展，传统的四合院已逐渐减少，但因其独特的建筑风格，四合院对中国文化的传承和中国历史的研究具有重要意义。", "en": "Siheyuan is a traditional residential building in China, characterized by houses built around a courtyard, enclosing the yard in the middle. Siheyuan is usually warm in winter and cool in summer, providing a comfortable environment, especially suitable for large families. There are various types of siheyuan across China, among which those in Beijing are the most typical. Nowadays, with the development of modern cities, traditional siheyuan have gradually decreased, but due to their unique architectural style, siheyuan are of great significance to the inheritance of Chinese culture and the study of Chinese history.", "tip": "“四合院” → Siheyuan (拼音，保留文化特色) “特点是” → characterized by “将院子合围在中间” → enclosing the yard in the middle “冬暖夏凉” → warm in winter and cool in summer “尤其适合” → especially suitable for “最为典型” → the most typical “逐渐减少” → have gradually decreased “具有重要意义” → are of great significance"}, {"id": "202312-3", "lab": "2023年12月 · 第3套", "yr": "2023", "cn": "改革开放以来，中国人民生活水平不断提高，这在人们的饮食（diet）变化上得到充分体现。如今，人们不再满足于吃得饱，而是追求吃得更加安全、更加营养、更加健康，食物也愈来愈丰富多样，不再限于本地的农产品。物流业（logistics industry）的发展使人们很容易品尝到全国各地的特产。毫无疑问，食品质量与饮食结构的改善为增进人们健康提供了有力的保障。", "en": "Since the reform and opening up, the living standards of the Chinese people have been continuously improving, which is fully reflected in the changes in people's diet. Nowadays, people are no longer content with having enough to eat, but pursue safer, more nutritious and healthier food. Food has become increasingly diverse and is no longer limited to local agricultural products. The development of the logistics industry has made it easy for people to taste specialties from all over the country. There is no doubt that the improvement in food quality and dietary structure provides a strong guarantee for enhancing people's health.", "tip": "“改革开放” → the reform and opening up “生活水平不断提高” → living standards have been continuously improving “充分体现” → is fully reflected in “满足于吃得饱” → content with having enough to eat “追求” → pursue “丰富多样” → increasingly diverse “物流业” → the logistics industry “特产” → specialties “毫无疑问” → There is no doubt that “有力的保障” → a strong guarantee"}, {"id": "202312-2", "lab": "2023年12月 · 第2套", "yr": "2023", "cn": "改革开放以来，中国人的饮食（diet）发生了显著变化。过去由于经济落后，食品种类有限、数量不足，人们仅仅满足于吃得饱。如今中国经济快速发展，食品不仅更加丰富多样，质量也大幅提高。随着生活水平不断提升，人们对饮食的要求越来越高，更加注重吃得营养健康。因此，目前市场上推出的低脂、低糖、有机食品受到人们的普遍欢迎。", "en": "Since the reform and opening up, the diet of the Chinese people has undergone remarkable changes. In the past, due to economic backwardness, food was limited in variety and quantity, and people were merely content with having enough to eat. Today, with the rapid development of China's economy, food has not only become more diverse but also greatly improved in quality. As living standards continue to rise, people have increasingly higher demands for their diet, placing more emphasis on eating nutritious and healthy food. Therefore, low-fat, lowsugar, and organic foods currently available on the market are widely welcomed by the public.", "tip": "“改革开放” → the reform and opening up “显著变化” → remarkable changes “经济落后” → economic backwardness “满足于吃得饱” → content with having enough to eat “丰富多样” → diverse “质量大幅提高” → greatly improved in quality “生活水平” → living standards “注重” → placing more emphasis on “低脂、低糖、有机食品” → low-fat, low-sugar, and organic foods “普遍欢迎” → widely welcomed"}, {"id": "202312-1", "lab": "2023年12月 · 第1套", "yr": "2023", "cn": "中国政府十分重视人民的健康饮食(diet)。通过大力提倡健康饮食，人们对合理营养增进健康的重要性有了更加深刻的认识。“吃得安全、吃得营养、吃得健康”是人民对美好生活的基本需要，是提升人民幸福感的必然要求，也为食品产业的发展提供了新机遇。目前，各级政府都在采取多种举措确保人民饮食健康，推进健康中国的建设。", "en": "The Chinese government attaches great importance to the healthy diet of its people. Through vigorously promoting healthy eating, people have gained a deeper understanding of the importance of proper nutrition in improving health. \"Eating safe, eating nutritious, and eating healthy\" is a basic need of the people for a better life, an inevitable requirement for enhancing people's sense of well-being, and also provides new opportunities for the development of the food industry. At present, governments at all levels are taking various measures to ensure people's dietary health and promote the construction of a Healthy China.", "tip": "“重视” → attaches great importance to “健康饮食” → healthy diet “大力提倡” → vigorously promoting “合理营养” → proper nutrition “基本需要” → basic need “必然要求” → inevitable requirement “新机遇” → new opportunities “多种举措” → various measures “健康中国” → Healthy China"}, {"id": "sim6", "lab": "模拟 · 广场舞", "yr": "模拟", "cn": "每到傍晚，中国许多城市的公园和广场上都会聚集大批中老年人，他们伴着音乐跳起广场舞。广场舞动作简单，容易学会，既能锻炼身体，又能结交朋友。不过，音乐声音过大时也会影响附近居民的生活，因此一些地方规定了活动时间和音量。", "en": "Every evening, large numbers of middle-aged and elderly people gather in parks and squares in many Chinese cities, dancing to music in what is known as square dancing. The movements are simple and easy to learn, and the activity not only exercises the body but also helps people make friends. However, too loud music may disturb nearby residents, so some places have set rules on the time and volume of the activity.", "tip": ""}, {"id": "sim5", "lab": "模拟 · 中医", "yr": "模拟", "cn": "中医有着几千年的历史，是中国传统文化的重要组成部分。中医强调人与自然的关系，主张通过调整饮食、作息和情绪来预防疾病。如今，针灸、推拿等疗法在世界许多国家得到应用，越来越多的外国人开始了解并接受中医。", "en": "Traditional Chinese medicine has a history of thousands of years and is an important part of traditional Chinese culture. It emphasizes the relationship between human beings and nature, and holds that diseases can be prevented by adjusting diet, daily routines and emotions. Today, therapies such as acupuncture and Tuina are used in many countries, and more and more foreigners are beginning to understand and accept this medical tradition.", "tip": ""}, {"id": "sim4", "lab": "模拟 · 垃圾分类", "yr": "模拟", "cn": "近年来，中国许多城市开始推行垃圾分类。居民需要把厨余垃圾、可回收物、有害垃圾和其他垃圾分别投放。刚开始时，不少人觉得麻烦，但逐渐养成了习惯。垃圾分类有助于减少污染、节约资源，是保护环境的重要一步。", "en": "In recent years, many cities in China have started to promote waste sorting. Residents are required to put kitchen waste, recyclables, hazardous waste and other waste into separate bins. At the beginning, quite a few people found it troublesome, but they gradually formed the habit. Waste sorting helps reduce pollution and save resources, and it is an important step towards protecting the environment.", "tip": ""}, {"id": "sim3", "lab": "模拟 · 移动支付", "yr": "模拟", "cn": "在中国，移动支付已经成为日常生活的一部分。无论是买菜、乘车还是交水电费，人们只要用手机扫一扫就能完成付款。移动支付不仅节省了时间，还减少了携带现金的麻烦。不过，老年人对这些新技术还不够熟悉，需要家人和社会的帮助。", "en": "In China, mobile payment has become part of daily life. Whether shopping for groceries, taking a bus or paying utility bills, people can complete the payment simply by scanning with their phones. Mobile payment not only saves time but also reduces the trouble of carrying cash. However, elderly people are still not familiar with these new technologies and need help from their families and society.", "tip": ""}, {"id": "sim2", "lab": "模拟 · 高铁出行", "yr": "模拟", "cn": "中国的高速铁路网是世界上最长的。乘坐高铁，人们可以在几个小时内从一座城市抵达另一座城市。车厢干净整洁，票价也相对合理，因此高铁成为许多人出行的首选。高铁的建设不仅方便了人们的往来，也带动了沿线地区的经济发展。", "en": "China's high-speed railway network is the longest in the world. By taking high-speed trains, people can travel from one city to another within a few hours. The carriages are clean and tidy, and the fares are relatively reasonable, so high-speed trains have become the first choice for many travellers. The construction of high-speed railways has not only made travel more convenient but also boosted the economic development of the regions along the lines.", "tip": ""}, {"id": "sim1", "lab": "模拟 · 共享单车", "yr": "模拟", "cn": "共享单车在中国许多城市随处可见。人们用手机扫码就能解锁一辆单车，短途出行因此变得方便又便宜。骑车还能减少交通拥堵和空气污染，所以越来越多的年轻人把它当作上下班的主要方式。不过，乱停乱放也给城市管理带来了新的难题。", "en": "Shared bikes can be seen everywhere in many Chinese cities. People can unlock a bike simply by scanning a QR code with their phone, which makes short trips convenient and cheap. Cycling also helps reduce traffic congestion and air pollution, so more and more young people take it as their main way of commuting. However, parking them at random has brought new problems to city management.", "tip": ""}];
var EXAM_FILTER = '全部';
var EXAM_OPEN = {};

/* ===== 考试倒计时 ===== */
function daysToExam() {
  if (!S.examDate) return null;
  var d = parseKey(S.examDate);
  var t = new Date();
  t.setHours(0, 0, 0, 0);
  return Math.round((d.getTime() - t.getTime()) / 86400000);
}
function examLineHTML() {
  var n = daysToExam();
  if (n === null) return '还没有设置考试倒计时，<a class="link-btn" href="#/data">去设置</a>';
  var name = esc(S.examName || '考试');
  if (n > 0) return '距离 <b>' + name + '</b> 还剩 <b class="num">' + n + '</b> 天';
  if (n === 0) return '<b>' + name + '</b> <b class="num">今天</b>开考';
  return '<b>' + name + '</b> 已经过去 <b class="num">' + (-n) + '</b> 天';
}

/* ===== 状态 ===== */
function blank() {
  return {
    p: {},
    daily: { date: '', newN: 0, revN: 0, correct: 0, wrong: 0 },
    history: {},
    goal: 20,
    examName: '大学英语四级考试',
    examDate: '',
    examDone: [],
    autoSpeak: false,
    wrong: [],
    custom: []
  };
}
var S = blank();
try {
  var rawState = localStorage.getItem(KEY);
  if (rawState) {
    var obj = JSON.parse(rawState);
    if (obj && typeof obj === 'object') {
      S = Object.assign(blank(), obj);
      if (!S.p || typeof S.p !== 'object') S.p = {};
      if (!Array.isArray(S.wrong)) S.wrong = [];
      if (!Array.isArray(S.custom)) S.custom = [];
      if (!S.history || typeof S.history !== 'object') S.history = {};
      if (!S.goal) S.goal = 20;
    }
  }
} catch (err) {}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (err) {}
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* ===== 词表与进度 ===== */
function customWords() { return parseLines(S.custom.join('\n'), '我的生词'); }
var CACHE = null;
function allWords() {
  if (CACHE) return CACHE;
  var seen = {};
  var out = [];
  BASE.concat(customWords()).forEach(function (x) {
    if (!seen[x.id]) { seen[x.id] = 1; out.push(x); }
  });
  CACHE = out;
  return out;
}
function clearCache() { CACHE = null; }
function findWord(id) {
  var list = allWords();
  for (var i = 0; i < list.length; i++) { if (list[i].id === id) return list[i]; }
  return null;
}
function ensure(id) {
  if (!S.p[id]) S.p[id] = { s: 0, due: startOfToday(), seen: 0, ok: 0, bad: 0, last: 0 };
  return S.p[id];
}
function addWrong(id) { if (S.wrong.indexOf(id) < 0) S.wrong.push(id); }
function removeWrong(id) {
  var i = S.wrong.indexOf(id);
  if (i >= 0) S.wrong.splice(i, 1);
}
function today() {
  var k = dayKey();
  if (!S.daily || S.daily.date !== k) {
    S.daily = { date: k, newN: 0, revN: 0, correct: 0, wrong: 0 };
  }
  return S.daily;
}
function bump(kind, ok) {
  var t = today();
  var k = dayKey();
  if (!S.history[k]) S.history[k] = { new: 0, rev: 0 };
  if (kind === 'new') { t.newN++; S.history[k].new++; }
  else { t.revN++; S.history[k].rev++; }
  if (ok === true) t.correct++;
  else if (ok === false) t.wrong++;
  save();
}
function dueWords() {
  var now = Date.now();
  return allWords().filter(function (x) {
    var p = S.p[x.id];
    return p && p.due <= now;
  }).sort(byFreq);
}
function freshWords() {
  return allWords().filter(function (x) { return !S.p[x.id] || S.p[x.id].seen === 0; }).sort(byFreq);
}
function bankStats() {
  var all = allWords();
  var st = { total: all.length, own: S.custom.length, learn: 0, fresh: 0, due: dueWords().length, mastered: 0 };
  all.forEach(function (x) {
    var p = S.p[x.id];
    if (!p || p.seen === 0) st.fresh++;
    else if (p.s >= 4) st.mastered++;
    else st.learn++;
  });
  return st;
}
function streak() {
  var k = dayKey();
  var has = function (key) {
    var h = S.history[key];
    return !!(h && ((h.new || 0) + (h.rev || 0)) > 0);
  };
  if (!has(k)) {
    k = shiftKey(k, -1);
    if (!has(k)) return 0;
  }
  var n = 0;
  while (has(k) && n < 500) { n++; k = shiftKey(k, -1); }
  return n;
}

/* ===== 会话 / 测验 状态 ===== */
var SESSION = null;
var QUIZ = null;
var BANK = { q: '', group: '全部', status: '全部', freq: '全部', sort: 'freq', adding: false, limit: 60 };
var CURRENT = 'today';

function newSession(list) {
  return { list: list, i: 0, revealed: false, spoken: '', counts: [0, 0, 0, 0] };
}
function buildSession(mode) {
  if (mode === 'wrong') {
    var wl = allWords().filter(function (x) { return S.wrong.indexOf(x.id) >= 0; });
    return wl.length ? newSession(wl) : null;
  }
  if (mode === 'more') {
    var fresh10 = freshWords().slice(0, 10);
    return fresh10.length ? newSession(fresh10) : null;
  }
  var t = today();
  var list = dueWords().slice(0, 40);
  var quota = Math.max(0, S.goal - t.newN);
  list = list.concat(freshWords().slice(0, quota));
  return list.length ? newSession(list) : null;
}
function gradeWord(id, level, isNew) {
  var p = ensure(id);
  p.seen++;
  p.last = Date.now();
  if (level === 0) {
    p.bad++;
    p.s = 0;
    p.due = startOfToday();
    addWrong(id);
  } else if (level === 1) {
    p.ok++;
    p.s = Math.max(0, p.s - 1);
    p.due = dueStamp(IV[p.s]);
  } else if (level === 2) {
    p.ok++;
    p.s = Math.min(6, p.s + 1);
    p.due = dueStamp(IV[p.s]);
  } else {
    p.ok++;
    p.s = Math.min(6, p.s + 2);
    p.due = dueStamp(IV[p.s]);
  }
  if (p.s >= 3) removeWrong(id);
  bump(isNew ? 'new' : 'rev', level === 0 ? false : (level >= 2 ? true : null));
}
function nextLabel(stage, level) {
  var ns;
  if (level === 0) ns = 0;
  else if (level === 1) ns = Math.max(0, stage - 1);
  else if (level === 2) ns = Math.min(6, stage + 1);
  else ns = Math.min(6, stage + 2);
  var d = IV[ns];
  return d === 0 ? '今天再记一遍' : (d === 1 ? '明天复习' : d + ' 天后复习');
}

/* ===== 今日视图 ===== */
function ringHTML(done, goal) {
  var C = 326.7;
  var pct = goal > 0 ? Math.min(1, done / goal) : 0;
  var off = (C * (1 - pct)).toFixed(1);
  return '<svg class="ring" viewBox="0 0 132 132" role="img" aria-label="今日进度">' +
    '<circle cx="66" cy="66" r="52" fill="none" stroke="#E4DFCF" stroke-width="7"/>' +
    '<circle cx="66" cy="66" r="52" fill="none" stroke="#AF3B2C" stroke-width="7" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="' + off + '" transform="rotate(-90 66 66)"/>' +
    '</svg>';
}
function viewToday() {
  var t = today();
  var st = bankStats();
  var due = st.due;
  var newLeft = Math.max(0, S.goal - t.newN);
  var doneToday = t.newN + t.revN;
  var answered = t.correct + t.wrong;
  var acc = answered ? Math.round(t.correct * 100 / answered) : null;

  var html = '' +
    '<section class="today-lead">' +
      '<div>' +
        '<p class="kicker">' + esc(fmtDate()) + '</p>' +
        '<div class="exam-band">' + examLineHTML() + '</div>' +
        '<h1 class="display">今天背 <span class="num">' + S.goal + '</span> 个词</h1>' +
      '</div>' +
      '<div class="ring-wrap">' + ringHTML(doneToday, S.goal) +
        '<div class="ring-mid"><span class="n">' + doneToday + '<span style="font-size:14px;color:#6F7D76">/' + S.goal + '</span></span><span class="l">今日完成</span></div>' +
      '</div>' +
    '</section>' +
    '<div class="metrics">' +
      '<div class="metric"><span class="n is-seal">' + due + '</span><span class="l">等待复习</span></div>' +
      '<div class="metric"><span class="n">' + newLeft + '</span><span class="l">待学新词</span></div>' +
      '<div class="metric"><span class="n is-jade">' + st.mastered + '</span><span class="l">已掌握</span></div>' +
    '</div>' +
    '<div class="cta-row">' +
      '<a class="btn btn-primary btn-lg" href="#/study">开始学习</a>' +
      '<a class="btn btn-lg" href="#/quiz">来一组四选一</a>' +
    '</div>' +
    '<p class="tiny" style="margin-top:10px">' + (acc === null

/* ===== 测验视图 ===== */
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function makeQuestion(x) {
  var dir = Math.random() < 0.5 ? 'e2c' : 'c2e';
  var pool = allWords();
  var correct = dir === 'e2c' ? x.cn : x.w;
  var opts = [correct];
  var guard = 0;
  while (opts.length < 4 && guard < 400) {
    guard++;
    var cand = pool[Math.floor(Math.random() * pool.length)];
    if (!cand) break;
    var text = dir === 'e2c' ? cand.cn : cand.w;
    if (text && text !== correct && opts.indexOf(text) < 0) opts.push(text);
  }
  var order = shuffle(opts);
  return { word: x, dir: dir, opts: order, ans: order.indexOf(correct) };
}
function buildQuiz(n, ids) {
  var picks;
  if (ids && ids.length) {
    picks = ids.map(function (id) { return findWord(id); }).filter(Boolean);
  } else {
    var all = allWords();
    var learned = all.filter(function (x) {
      var p = S.p[x.id];
      return !!(p && p.seen);
    });
    picks = shuffle(learned).slice(0, n);
  }
  if (!picks.length) return null;
  return { list: picks.map(makeQuestion), i: 0, chosen: null, correct: 0, wrong: [] };
}
function viewQuiz() {
  if (!QUIZ) QUIZ = buildQuiz(30);
  return '<div class="quiz-wrap">' +
    '<div class="card-top"><span class="grp">四选一测验</span><span id="quizMeta"></span></div>' +
    '<div id="quizBody"></div>' +

}

function answerQuiz(idx) {
  if (!QUIZ || QUIZ.chosen !== null) return;
  var q = QUIZ.list[QUIZ.i];
  if (!q || idx < 0 || idx >= q.opts.length) return;
  QUIZ.chosen = idx;
  var ok = idx === q.ans;
  var id = q.word.id;
  var prev = S.p[id];
  var isNew = !prev || prev.seen === 0;
  var p = ensure(id);
  p.seen++;
  if (ok) {
    QUIZ.correct++;
    p.ok++;
    if (p.s >= 3) removeWrong(id);
    if (isNew) { p.s = 1; p.due = dueStamp(1); }
  } else {
    QUIZ.wrong.push(q.word.w);
    p.bad++;
    p.s = 0;
    p.due = startOfToday();
    addWrong(id);
  }
  bump(isNew ? 'new' : 'rev', ok);
  renderQuizBody();
  updateChrome();
}

    if (!w) return '';
    return '<div class="bank-row">' +
      '<div class="bw"><span class="w">' + esc(w.w) + '</span></div>' +
      '<div class="bm">' + (w.pos ? '<span class="pt">' + esc(w.pos) + '</span>' : '') + esc(w.cn) + '</div>' +
      '<div class="bs"><button class="link-btn" data-act="unwrong" data-w="' + esc(w.w) + '">移出</button></div>' +
      '</div>';
  }).join('');

  var html = '' +
    '<p class="kicker">' + esc(fmtDate()) + '</p>' +
    '<h1 class="display">学习数据</h1>' +
    '<p class="lead-sub">今天完成 ' + (t.newN + t.revN) + ' 个词，答对率 ' + acc + '%。</p>' +
    '<div class="tiles" style="margin-top:20px">' +
      '<div class="tile"><span class="n">' + st.total + '</span><span class="l">词库总数</span></div>' +
      '<div class="tile"><span class="n" style="color:#2C7161">' + st.mastered + '</span><span class="l">已掌握（第 5 阶以上）</span></div>' +
      '<div class="tile"><span class="n">' + st.fresh + '</span><span class="l">还没学过</span></div>' +
      '<div class="tile"><span class="n" style="color:#AF3B2C">' + st.due + '</span><span class="l">现在等复习</span></div>' +
    '</div>' +
    '<div class="sect"><h2>最近 7 天</h2><span class="meta">每天过手的词卡数</span></div>' +
    '<div class="chart">' + bars + '</div>' +
    '<div class="chart-legend"><span><i style="background:#254A42"></i>新词与复习合计</span><span><i style="background:#AF3B2C"></i>今天</span></div>' +
    '<div class="sect"><h2>错词本</h2><span class="meta">' + S.wrong.length + ' 个</span></div>';

  if (S.wrong.length) {
    html += '<div class="btn-row" style="margin-bottom:6px"><button class="btn" data-act="study-wrong">整组复习错词</button></div>' + wrongRows;
    if (S.wrong.length > 30) html += '<p class="tiny" style="margin-top:10px">只显示前 30 个，整组复习时会全部带上。</p>';
  } else {
    html += '<p class="tiny">错词本是空的。闪卡里选「不认识」、测验里答错的词会自动收进来。</p>';
  }

  html += '<div class="sect"><h2>考试倒计时</h2><span class="meta">显示在今日页</span></div>' +
    '<div class="exam-set">' +
      '<input class="field" id="examName" placeholder="考试名称，如 大学英语四级考试" value="' + esc(S.examName || '') + '" autocomplete="off">' +
      '<input class="field" id="examDate" type="date" value="' + esc(S.examDate || '') + '">' +
      '<button class="btn btn-primary" data-act="save-exam">保存</button>' +
    '</div>' +
    '<div class="sect"><h2>设置</h2><span class="meta">每日新词数量</span></div>' +
    '<div class="chips">' + [10, 20, 30, 50].map(function (n) {
      return '<button class="chip' + (S.goal === n ? ' active' : '') + '" data-act="goal" data-v="' + n + '">' + n + ' 词 / 天</button>';
    }).join('') + '</div>' +
    '<div class="goal-row">' +
      '<span class="goal-lab">自定义</span>' +
      '<button class="step" data-act="goal-step" data-v="-1" aria-label="减少">-</button>' +
      '<input class="field goal-num" id="goalNum" type="number" min="1" max="300" step="1" inputmode="numeric" value="' + S.goal + '">' +
      '<button class="step" data-act="goal-step" data-v="1" aria-label="增加">+</button>' +
      '<button class="btn" data-act="goal-set">应用</button>' +
      '<span class="tiny" style="margin:0">1 - 300 词 / 天，默认 20</span>' +
    '</div>' +
    '<div class="set-row"><div class="lab">导出备份<span>下载一个 JSON 文件，换设备或清缓存前留底</span></div>' +
      '<button class="btn" data-act="export">导出数据</button></div>' +
    '<div class="set-row"><div class="lab">清空学习记录<span>词库和「我的生词」保留，进度与错词清除</span></div>' +
      '<button class="btn" data-act="reset">清空</button></div>' +
    '<p class="tiny" style="margin-top:18px">进度只存在这台设备的浏览器本地（localStorage），不上传任何服务器。清理浏览器数据会一并清掉，重要阶段记得先导出。</p>';
  return html;
}

/* ===== 渲染与路由 ===== */
function viewExam() {
  var done = S.examDone || [];
  var years = ['全部', '2026', '2025', '2024', '2023', '模拟'];
  var list = EXAM_TRANS.filter(function (x) {
    return EXAM_FILTER === '全部' || x.yr === EXAM_FILTER;
  });
  var html = '<section class="today-lead"><div>' +
    '<p class="kicker">真题翻译</p>' +
    '<h1 class="display">历年真题 <span class="num">汉译英</span></h1>' +
    '<p class="lead-sub">共 ' + EXAM_TRANS.length + ' 段，已练 ' + done.length + ' 段。先自己翻一遍，再对照参考译文。</p>' +
    '</div></section>' +
    '<div class="chips">' + years.map(function (y) {
      return '<button class="chip' + (EXAM_FILTER === y ? ' active' : '') + '" data-act="tx-filter" data-v="' + y + '">' + y + '</button>';
    }).join('') + '</div>';
  if (!list.length) return html + '<p class="tiny">这个筛选下暂无题目。</p>';
  html += list.map(function (x) {
    var open = !!EXAM_OPEN[x.id];
    var isDone = done.indexOf(x.id) >= 0;
    var h = '<div class="tx-card"><div class="tx-meta"><span class="tx-tag">' + esc(x.lab) + '</span>' +
      (isDone ? '<span class="tx-flag">已练</span>' : '') + '</div>' +
      '<div class="tx-cn">' + esc(x.cn) + '</div>';
    if (open) {
      h += '<div class="tx-en"><div class="tx-en-hd">参考译文</div><div class="tx-en-b">' + esc(x.en) + '</div>';
      if (x.tip) h += '<div class="tx-tip"><b>关键译点</b>' + esc(x.tip) + '</div>';
      h += '</div>';
    }
    h += '<div class="tx-acts">' +
      '<button class="btn" data-act="tx-toggle" data-id="' + x.id + '">' + (open ? '收起译文' : '看参考译文') + '</button>' +
      '<button class="btn' + (isDone ? '' : ' btn-primary') + '" data-act="tx-done" data-id="' + x.id + '">' + (isDone ? '取消已练' : '练过了') + '</button>' +
      '</div></div>';
    return h;
  }).join('');
  return html;
}
var VIEWS = { today: viewToday, study: viewStudy, quiz: viewQuiz, bank: viewBank, exam: viewExam, data: viewData };

function updateChrome() {
  document.querySelectorAll('[data-nav]').forEach(function (a) {
    a.classList.toggle('active', a.getAttribute('data-nav') === CURRENT);
  });
  var due = dueWords().length;
  document.querySelectorAll('[data-count]').forEach(function (el) {
    var k = el.getAttribute('data-count');
    if (k === 'goal') el.textContent = S.goal;
    else if (k === 'today') el.textContent = due ? String(due) : '';
  });
}
function render() {
  var fn = VIEWS[CURRENT] || VIEWS.today;
  var view = document.getElementById('view');
  view.innerHTML = fn();
  updateChrome();
  if (CURRENT === 'study') renderStudyCard();
  else if (CURRENT === 'quiz') renderQuizBody();
  else if (CURRENT === 'bank') renderBankList();
}
function route() {
  var raw = (location.hash || '').replace(/^#\/?/, '');
  var name = raw.split('?')[0] || 'today';
  CURRENT = VIEWS[name] ? name : 'today';
  render();
}
function go(name) {
  var target = '#/' + name;
  if (location.hash === target) render();
  else location.hash = target;
}

/* ===== 交互 ===== */
var toastTimer = null;
function toast(msg) {
  var el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
}
function speak(text) {
  if (!text) return;
  if (!('speechSynthesis' in window)) { toast('这个浏览器不支持朗读'); return; }
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.9;
    window.speechSynthesis.speak(u);
  } catch (err) { toast('朗读没有启动成功'); }
}
function addCustom() {
  var wEl = document.getElementById('newWord');
  var posEl = document.getElementById('newPos');
  var cnEl = document.getElementById('newMeaning');
  var exEl = document.getElementById('newEx');
  if (!wEl || !cnEl) return;
  var w = wEl.value.trim();
  var cn = cnEl.value.trim();
  if (!w || !cn) { toast('单词和释义都要填写'); return; }
  if (w.indexOf('|') >= 0 || cn.indexOf('|') >= 0) { toast('内容里不能包含竖线'); return; }
  var exists = allWords().some(function (x) { return x.id === w.toLowerCase(); });
  if (exists) { toast('词库里已经有这个单词了'); return; }
  var pos = posEl ? posEl.value.trim().replace(/\|/g, '') : '';
  var ex = exEl ? exEl.value.trim().replace(/\|/g, '') : '';
  S.custom.push(w + '|' + pos + '|' + cn + '||' + ex + '|');
  clearCache();
  save();
  BANK.adding = false;
  render();
  toast('已加入「我的生词」');
}
function deleteCustom(word) {
  var id = word.toLowerCase();
  S.custom = S.custom.filter(function (line) {
    return line.split('|')[0].trim().toLowerCase() !== id;
  });
  clearCache();
  delete S.p[id];
  removeWrong(id);
  save();
  render();
  toast('已移除这个词');
}
function exportData() {
  try {
    var blob = new Blob([JSON.stringify({ app: 'Chao', exported: new Date().toISOString(), data: S }, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'Chao备份-' + dayKey() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
    toast('备份文件已开始下载');
  } catch (err) { toast('导出失败，换个浏览器试试'); }
}
function resetAll() {
  if (!window.confirm('清空全部学习进度和错词？词库与「我的生词」会保留。')) return;
  var custom = S.custom.slice();
  S = blank();
  S.custom = custom;
  clearCache();
  SESSION = null;
  QUIZ = null;
  save();
  render();
  toast('学习记录已清空');
}

document.getElementById('view').addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!t) return;
  var act = t.getAttribute('data-act');
  var val = t.getAttribute('data-v');

  if (act === 'reveal') {
    if (SESSION && !SESSION.revealed && SESSION.i < SESSION.list.length) {
      SESSION.revealed = true;
      renderStudyCard();
    }
    return;
  }
  if (act === 'grade') {
    gradeCurrent(Number(t.getAttribute('data-level')));
    return;
  }
  if (act === 'tx-filter') { EXAM_FILTER = val || '全部'; render(); return; }
  if (act === 'tx-toggle') {
    var tid = t.getAttribute('data-id');
    EXAM_OPEN[tid] = !EXAM_OPEN[tid];
    render();
    return;
  }
  if (act === 'tx-done') {
    var did = t.getAttribute('data-id');
    if (!S.examDone) S.examDone = [];
    var idx = S.examDone.indexOf(did);
    if (idx >= 0) S.examDone.splice(idx, 1); else S.examDone.push(did);
    save();
    render();
    toast(idx >= 0 ? '已取消标记' : '已练 ' + S.examDone.length + ' 段');
    return;
  }
  if (act === 'more-sents') {
    var box = t.parentNode.querySelector('.sent-rest');
    if (box) {
      var open = box.classList.toggle('open');
      var rest = t.getAttribute('data-rest');
      var total = t.getAttribute('data-total');
      t.textContent = open ? '收起例句' : '展开另外 ' + rest + ' 句（共 ' + total + ' 句）';
    }
    return;
  }
  if (act === 'speak') { speak(t.getAttribute('data-w')); return; }
  if (act === 'restart') {
    SESSION = buildSession('mix');
    renderStudyCard();
    toast(SESSION ? '新的一轮已排好' : '现在没有待复习的词');
    return;
  }
  if (act === 'study-more') {
    var s = buildSession('more');
    if (!s) { toast('词库里的新词都学完了，可以自己添加生词'); return; }
    SESSION = s;
    if (CURRENT !== 'study') go('study');
    else { render(); }
    toast('已加入 ' + SESSION.list.length + ' 个新词');
    return;
  }
  if (act === 'study-wrong') {
    var sw = buildSession('wrong');
    if (!sw) { toast('错词本是空的'); return; }
    SESSION = sw;
    if (CURRENT !== 'study') go('study');
    else render();
    toast('开始复习 ' + SESSION.list.length + ' 个错词');
    return;
  }
  if (act === 'answer') { answerQuiz(Number(t.getAttribute('data-i'))); return; }
  if (act === 'next') { nextQuiz(); return; }
  if (act === 'quiz-restart') {
    QUIZ = buildQuiz(30);
    render();
    return;
  }
  if (act === 'quiz-wrong') {
    var ids = QUIZ ? QUIZ.wrong.map(function (w) { return w.toLowerCase(); }) : [];
    var q2 = buildQuiz(10, ids);
    if (!q2) { toast('没有可练的错词'); return; }
    QUIZ = q2;
    render();
    return;
  }
  if (act === 'group') { BANK.group = val; BANK.limit = 60; render(); return; }
  if (act === 'status') { BANK.status = val; BANK.limit = 60; render(); return; }
  if (act === 'tier') { BANK.freq = val; BANK.limit = 60; render(); return; }
  if (act === 'sort') { BANK.sort = val; BANK.limit = 60; render(); return; }
  if (act === 'bank-more') { BANK.limit += 60; renderBankList(); return; }
  if (act === 'toggle-add') { BANK.adding = !BANK.adding; render(); return; }
  if (act === 'add-word') { addCustom(); return; }
  if (act === 'del-custom') { deleteCustom(t.getAttribute('data-w')); return; }
  if (act === 'unwrong') { removeWrong(t.getAttribute('data-w').toLowerCase()); save(); render(); toast('已移出错词本'); return; }
  if (act === 'save-exam') {
    var nm = document.getElementById('examName');
    var dt = document.getElementById('examDate');
    S.examName = (nm && nm.value.trim()) ? nm.value.trim() : '考试';
    S.examDate = dt ? dt.value : '';
    save();
    render();
    toast(S.examDate ? '倒计时已更新' : '已清除考试日期');
    return;
  }
  if (act === 'goal-step') {
    var gi = document.getElementById('goalNum');
    if (gi) {
      var cur = parseInt(gi.value, 10) || S.goal;
      cur = cur + parseInt(val, 10);
      if (cur < 1) cur = 1;
      if (cur > 300) cur = 300;
      gi.value = cur;
    }
    return;
  }
  if (act === 'goal-set') {
    var gj = document.getElementById('goalNum');
    var n = gj ? parseInt(gj.value, 10) : 0;
    if (!n || n < 1) n = 20;
    if (n > 300) n = 300;
    S.goal = n;
    save();
    render();
    toast('每日新词改为 ' + n + ' 个');
    return;
  }
  if (act === 'goal') {
    S.goal = Number(val) || 20;
    save();
    render();
    toast('每日目标改为 ' + S.goal + ' 个新词');
    return;
  }
  if (act === 'toggle-speak') {
    S.autoSpeak = !S.autoSpeak;
    save();
    render();
    toast(S.autoSpeak ? '已开启自动朗读' : '已关闭自动朗读');
    return;
  }
  if (act === 'export') { exportData(); return; }
  if (act === 'reset') { resetAll(); return; }
});

document.getElementById('view').addEventListener('input', function (e) {
  if (e.target && e.target.id === 'bankSearch') {
    BANK.q = e.target.value;
    renderBankList();
  }
});

document.addEventListener('keydown', function (e) {
  var tag = e.target && e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (CURRENT === 'study') {
    if (e.key === ' ' || e.key === 'Enter') {
      if (SESSION && SESSION.i < SESSION.list.length && !SESSION.revealed) {
        e.preventDefault();
        SESSION.revealed = true;
        renderStudyCard();
      }
      return;
    }
    if (/^[1-4]$/.test(e.key) && SESSION && SESSION.revealed) {
      e.preventDefault();
      gradeCurrent(Number(e.key) - 1);
    }
    return;
  }
  if (CURRENT === 'quiz' && QUIZ) {
    if (/^[1-4]$/.test(e.key) && QUIZ.chosen === null && QUIZ.i < QUIZ.list.length) {
      e.preventDefault();
      answerQuiz(Number(e.key) - 1);
    } else if (e.key === 'Enter' && QUIZ.chosen !== null) {
      e.preventDefault();
      nextQuiz();
    }
  }
});

window.addEventListener('hashchange', route);
today();
route();
</script>
